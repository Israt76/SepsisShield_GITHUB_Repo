<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Deterministic, frame-by-frame renderer: window.render(t) draws the scene at time t (seconds).
const W = 1920, H = 1080, DUR = 7.5;
const c = document.getElementById('c'), g = c.getContext('2d');
const SANS = '"Noto Sans CJK JP", "DejaVu Sans", sans-serif';

// timeline (seconds)
const T_GLITCH = 2.3, T_BADTEMP = 2.65, T_RISK = 3.2, T_TRUST = 4.8, T_FADE = 6.9;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, u) => a + (b - a) * u;

// ---------- physiological waveforms (period-normalised) ----------
const HR = 86, RR = 16;
function ecg(p) {           // p in [0,1): one cardiac cycle, PQRST
  const gauss = (x, m, s, a) => a * Math.exp(-((x - m) ** 2) / (2 * s * s));
  return gauss(p, 0.18, 0.025, 0.12) - gauss(p, 0.285, 0.008, 0.10) + gauss(p, 0.30, 0.010, 1.0)
       - gauss(p, 0.318, 0.010, 0.22) + gauss(p, 0.55, 0.045, 0.28);
}
function pleth(p) {
  const x = (p + 0.72) % 1;
  return 0.9 * Math.exp(-((x - 0.18) ** 2) / 0.006) + 0.35 * Math.exp(-((x - 0.42) ** 2) / 0.012) + 0.15 * (1 - x);
}
function resp(p) { return 0.5 - 0.5 * Math.cos(2 * Math.PI * p); }

// ---------- static background (drawn once to an offscreen canvas) ----------
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function drawBackground() {
  const b = bg.getContext('2d');
  // room: cool, dim ICU at night
  let gr = b.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#0f1a24'); gr.addColorStop(0.55, '#0b141c'); gr.addColorStop(1, '#070c11');
  b.fillStyle = gr; b.fillRect(0, 0, W, H);
  // window glow upper left
  gr = b.createRadialGradient(380, 180, 20, 380, 180, 700);
  gr.addColorStop(0, 'rgba(120,160,200,0.22)'); gr.addColorStop(1, 'rgba(120,160,200,0)');
  b.fillStyle = gr; b.fillRect(0, 0, W, H);
  // wall panel / headwall
  b.fillStyle = 'rgba(160,185,205,0.05)'; b.fillRect(0, 150, W, 330);
  b.fillStyle = 'rgba(160,185,205,0.07)'; b.fillRect(0, 470, W, 6);
  // bokeh lights (out-of-focus equipment LEDs)
  const bokeh = [[180,300,26,'90,200,160'],[260,330,14,'240,200,120'],[1500,250,30,'120,170,230'],[1650,300,18,'90,200,160'],
                 [1770,220,22,'230,120,110'],[980,210,16,'120,170,230'],[1210,330,12,'240,200,120'],[90,520,20,'120,170,230']];
  for (const [x, y, r, col] of bokeh) {
    const rg = b.createRadialGradient(x, y, 0, x, y, r * 2.2);
    rg.addColorStop(0, `rgba(${col},0.35)`); rg.addColorStop(0.5, `rgba(${col},0.12)`); rg.addColorStop(1, `rgba(${col},0)`);
    b.fillStyle = rg; b.beginPath(); b.arc(x, y, r * 2.2, 0, 7); b.fill();
  }
  // --- patient in bed (soft, out of focus — shapes drawn then blurred) ---
  const p = document.createElement('canvas'); p.width = W; p.height = H;
  const q = p.getContext('2d');
  // bed frame
  q.fillStyle = '#1b2733'; q.fillRect(120, 700, 1180, 60);
  q.fillStyle = '#243240'; q.fillRect(140, 760, 30, 200); q.fillRect(1240, 760, 30, 200);
  // mattress + sheet
  let sg = q.createLinearGradient(0, 560, 0, 720);
  sg.addColorStop(0, '#c9d3dc'); sg.addColorStop(1, '#8e9aa6');
  q.fillStyle = sg;
  q.beginPath(); q.moveTo(150, 700); q.bezierCurveTo(300, 560, 600, 600, 780, 590);
  q.bezierCurveTo(980, 575, 1180, 610, 1290, 700); q.closePath(); q.fill();
  // blanket folds (subtle)
  q.strokeStyle = 'rgba(90,105,120,0.45)'; q.lineWidth = 6;
  for (const [a, b2] of [[520, 640], [760, 630], [980, 645]]) { q.beginPath(); q.moveTo(a, b2); q.quadraticCurveTo(a + 60, b2 - 30, a + 140, b2 - 6); q.stroke(); }
  // pillow
  sg = q.createLinearGradient(0, 520, 0, 640); sg.addColorStop(0, '#e3e9ee'); sg.addColorStop(1, '#a9b4be');
  q.fillStyle = sg; q.beginPath(); q.ellipse(300, 600, 160, 62, -0.08, 0, 7); q.fill();
  // head & shoulder (profile, resting)
  sg = q.createRadialGradient(330, 560, 10, 330, 575, 90); sg.addColorStop(0, '#b58c73'); sg.addColorStop(1, '#6d5040');
  q.fillStyle = sg; q.beginPath(); q.ellipse(335, 572, 62, 50, 0.15, 0, 7); q.fill();
  q.fillStyle = '#2a211c'; q.beginPath(); q.ellipse(300, 556, 52, 44, 0.25, 0, 7); q.fill();   // hair
  q.fillStyle = '#7f96ab'; q.beginPath(); q.ellipse(470, 625, 120, 40, -0.05, 0, 7); q.fill();  // gown shoulder
  // nasal cannula tubing
  q.strokeStyle = 'rgba(210,225,235,0.6)'; q.lineWidth = 3;
  q.beginPath(); q.moveTo(380, 585); q.bezierCurveTo(430, 640, 520, 700, 640, 720); q.stroke();
  // IV pole + bag
  q.fillStyle = '#5d6c7a'; q.fillRect(1380, 250, 10, 700);
  q.fillStyle = 'rgba(200,225,240,0.55)'; q.beginPath(); q.roundRect(1340, 270, 90, 140, 16); q.fill();
  q.strokeStyle = 'rgba(200,225,240,0.5)'; q.lineWidth = 3;
  q.beginPath(); q.moveTo(1385, 410); q.bezierCurveTo(1360, 560, 1100, 620, 900, 640); q.stroke();
  b.save(); b.setTransform(0.82, 0, 0, 0.82, -30, 318); b.filter = 'blur(4px)'; b.globalAlpha = 0.9; b.drawImage(p, 0, 0); b.restore(); b.filter = 'none'; b.globalAlpha = 1;
  // gentle vignette
  gr = b.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1150);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.65)');
  b.fillStyle = gr; b.fillRect(0, 0, W, H);
})();

// ---------- monitor geometry ----------
const M = { x: 820, y: 170, w: 1000, h: 610 };      // bezel
const S = { x: M.x + 26, y: M.y + 26, w: M.w - 52, h: M.h - 70 };   // screen
const WAVE_W = 640;                                 // waveform area width
const ROWS = [   // label, colour, value getter
  { key: 'ECG', lbl: 'II', col: '#3ee08a', y: 70, h: 120 },
  { key: 'SPO2', lbl: 'Pleth', col: '#35d4f0', y: 205, h: 95 },
  { key: 'RESP', lbl: 'Resp', col: '#f2d24b', y: 315, h: 80 },
];

function drawWave(ctx, t, row, x0, y0) {
  // classic sweep: trace drawn left→right, a gap ("erase bar") travels with the write head
  const sweep = 4.0;            // seconds per screen width
  const head = ((t % sweep) / sweep) * WAVE_W;
  ctx.strokeStyle = row.col; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
  ctx.beginPath();
  let pen = false;
  for (let px = 0; px <= WAVE_W; px += 2) {
    if (px > head && px < head + 28) { pen = false; continue; }
    // time represented at this pixel: current sweep if left of head, previous sweep if right
    const tp = t - ((head - px) / WAVE_W) * sweep - (px > head ? sweep : 0) * 0;
    const tt = px <= head ? t - (head - px) / WAVE_W * sweep : t - (head + WAVE_W - px) / WAVE_W * sweep;
    let v;
    if (row.key === 'ECG') v = ecg(((tt * HR / 60) % 1 + 1) % 1);
    else if (row.key === 'SPO2') v = pleth(((tt * HR / 60) % 1 + 1) % 1);
    else v = resp(((tt * RR / 60) % 1 + 1) % 1);
    const y = y0 + row.h * (row.key === 'ECG' ? 0.72 - v * 0.62 : 0.9 - v * 0.8);
    if (!pen) { ctx.moveTo(x0 + px, y); pen = true; } else ctx.lineTo(x0 + px, y);
  }
  ctx.stroke();
  // write-head dot
  ctx.fillStyle = row.col;
}

function glitchText(str, t, seed) {
  const chars = '0123456789.#%?';
  return str.split('').map((ch, i) => {
    const r = Math.abs(Math.sin((Math.floor(t * 30) + i * 7 + seed) * 12.9898) * 43758.5453) % 1;
    return ch === ' ' ? ' ' : chars[Math.floor(r * chars.length)];
  }).join('');
}

function drawMonitor(ctx, t) {
  // bezel
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  let gr = ctx.createLinearGradient(0, M.y, 0, M.y + M.h);
  gr.addColorStop(0, '#2b3137'); gr.addColorStop(1, '#1a1e22');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.roundRect(M.x, M.y, M.w, M.h, 26); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#3a4148'; ctx.fillRect(M.x + M.w / 2 - 60, M.y + M.h - 26, 120, 6);   // speaker grille hint
  // screen
  ctx.fillStyle = '#020405'; ctx.beginPath(); ctx.roundRect(S.x, S.y, S.w, S.h, 8); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.roundRect(S.x, S.y, S.w, S.h, 8); ctx.clip();
  // header bar
  ctx.fillStyle = '#0c1a24'; ctx.fillRect(S.x, S.y, S.w, 40);
  ctx.font = `600 20px ${SANS}`; ctx.fillStyle = '#9fb3c4'; ctx.textBaseline = 'middle';
  ctx.fillText('ICU-3  ·  BED 12  ·  ADULT', S.x + 18, S.y + 20);
  const secs = 2 * 3600 + 14 * 60 + Math.floor(t);
  const hh = String(Math.floor(secs / 3600)).padStart(2, '0'), mm = String(Math.floor(secs / 60) % 60).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
  ctx.textAlign = 'right'; ctx.fillText(`${hh}:${mm}:${ss}`, S.x + S.w - 18, S.y + 20); ctx.textAlign = 'left';
  // grid lines between rows
  ctx.strokeStyle = 'rgba(120,150,170,0.14)'; ctx.lineWidth = 1;
  for (const r of ROWS) { ctx.beginPath(); ctx.moveTo(S.x, S.y + r.y + r.h + 6); ctx.lineTo(S.x + S.w, S.y + r.y + r.h + 6); ctx.stroke(); }
  // waveforms + labels
  for (const r of ROWS) {
    ctx.font = `600 18px ${SANS}`; ctx.fillStyle = r.col; ctx.fillText(r.lbl, S.x + 16, S.y + r.y + 12);
    drawWave(ctx, t, r, S.x + 16, S.y + r.y);
  }
  // numerics column
  const nx = S.x + WAVE_W + 50;
  const numeric = (label, unit, value, col, y, big = 76) => {
    ctx.font = `600 18px ${SANS}`; ctx.fillStyle = col; ctx.fillText(label, nx, S.y + y);
    ctx.font = `500 16px ${SANS}`; ctx.fillStyle = 'rgba(200,210,220,0.6)'; ctx.fillText(unit, nx + 170, S.y + y);
    ctx.font = `600 ${big}px ${SANS}`; ctx.fillStyle = col; ctx.fillText(value, nx, S.y + y + big * 0.72);
  };
  numeric('HR', 'bpm', String(HR + (Math.floor(t * 0.7) % 2)), '#3ee08a', 82);
  numeric('SpO₂', '%', '97', '#35d4f0', 212);
  numeric('RR', 'rpm', String(RR), '#f2d24b', 322, 64);
  // bottom strip: NBP + Temp
  const by = S.y + 430;
  ctx.fillStyle = '#071018'; ctx.fillRect(S.x, by - 12, S.w, S.h - 430 + 12);
  ctx.font = `600 18px ${SANS}`; ctx.fillStyle = '#e8edf2'; ctx.fillText('NBP  mmHg', S.x + 18, by + 14);
  ctx.font = `600 54px ${SANS}`; ctx.fillText('122/68', S.x + 18, by + 64);
  ctx.font = `500 26px ${SANS}`; ctx.fillStyle = 'rgba(232,237,242,0.75)'; ctx.fillText('(86)', S.x + 212, by + 64);
  // temperature — the corrupted channel
  const tx = S.x + 420;
  let tStr = '36.9', tCol = '#ff9a3d';
  if (t >= T_GLITCH && t < T_BADTEMP) tStr = glitchText('36.9', t, 3);
  if (t >= T_BADTEMP) tStr = '98.4';
  ctx.font = `600 18px ${SANS}`; ctx.fillStyle = tCol; ctx.fillText('TEMP  °C', tx, by + 14);
  ctx.font = `600 54px ${SANS}`; ctx.fillStyle = tCol; ctx.fillText(tStr, tx, by + 64);
  if (t >= T_BADTEMP) {   // pulsing outline on the impossible reading
    const a = 0.45 + 0.35 * Math.sin((t - T_BADTEMP) * 9);
    ctx.strokeStyle = `rgba(255,90,70,${a})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(tx - 12, by - 6, 210, 84, 8); ctx.stroke();
  }
  // subtle scanline / glass
  ctx.restore();
  gr = ctx.createLinearGradient(S.x, S.y, S.x + S.w, S.y + S.h);
  gr.addColorStop(0, 'rgba(255,255,255,0.05)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.0)'); gr.addColorStop(1, 'rgba(255,255,255,0.02)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.roundRect(S.x, S.y, S.w, S.h, 8); ctx.fill();
}

// ---------- SepsisShield decision-support panel ----------
function drawPanel(ctx, t) {
  const appear = ease((t - 0.6) / 0.6);
  if (appear <= 0) return;
  const P = { x: 110, y: 150, w: 620, h: 476 };
  ctx.save(); ctx.globalAlpha = appear;
  const trustLow = t >= T_TRUST, tl = ease((t - T_TRUST) / 0.35);
  // card
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 12;
  ctx.fillStyle = 'rgba(252,252,251,0.97)'; ctx.beginPath(); ctx.roundRect(P.x, P.y, P.w, P.h, 18); ctx.fill();
  ctx.shadowColor = 'transparent';
  if (trustLow) { ctx.strokeStyle = `rgba(208,59,59,${tl})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect(P.x, P.y, P.w, P.h, 18); ctx.stroke(); }
  // header
  ctx.textBaseline = 'alphabetic';
  // shield glyph
  const sx = P.x + 34, sy = P.y + 38;
  ctx.fillStyle = '#2a78d6'; ctx.beginPath();
  ctx.moveTo(sx, sy - 18); ctx.lineTo(sx + 18, sy - 12); ctx.lineTo(sx + 18, sy + 4); ctx.quadraticCurveTo(sx + 16, sy + 18, sx, sy + 24);
  ctx.quadraticCurveTo(sx - 16, sy + 18, sx - 18, sy + 4); ctx.lineTo(sx - 18, sy - 12); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(sx - 8, sy + 2); ctx.lineTo(sx - 2, sy + 8); ctx.lineTo(sx + 9, sy - 4); ctx.stroke();
  ctx.font = `700 28px ${SANS}`; ctx.fillStyle = '#0b0b0b'; ctx.fillText('SepsisShield AI', P.x + 66, P.y + 48);
  ctx.font = `500 16px ${SANS}`; ctx.fillStyle = '#52514e'; ctx.fillText('research prototype · not a medical device', P.x + 66, P.y + 72);
  ctx.fillStyle = '#e6e5e1'; ctx.fillRect(P.x + 24, P.y + 92, P.w - 48, 2);

  // risk
  const riskU = ease((t - T_RISK) / 0.9);
  const risk = lerp(0.6, 3.9, riskU);
  const alert = risk >= 3.0;
  ctx.font = `600 15px ${SANS}`; ctx.fillStyle = '#52514e'; ctx.fillText('SEPSIS RISK (NEXT ~6–12 H)', P.x + 28, P.y + 128);
  const withheld = trustLow;
  ctx.font = `700 72px ${SANS}`;
  ctx.fillStyle = withheld ? `rgba(138,137,132,${0.4 + 0.6 * (1 - tl)})` : (alert ? '#d03b3b' : '#0b0b0b');
  const rtxt = risk.toFixed(1) + '%';
  ctx.fillText(rtxt, P.x + 26, P.y + 200);
  const rw = ctx.measureText(rtxt).width;
  if (withheld) { ctx.strokeStyle = `rgba(138,137,132,${tl})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(P.x + 26, P.y + 176); ctx.lineTo(P.x + 26 + rw * tl, P.y + 176); ctx.stroke(); }
  // alert chip
  ctx.font = `700 22px ${SANS}`;
  if (withheld) {
    ctx.fillStyle = '#52514e'; ctx.fillText('Prediction withheld', P.x + rw + 52, P.y + 180);
    ctx.font = `500 16px ${SANS}`; ctx.fillText('not issued until inputs are verified', P.x + rw + 52, P.y + 204);
  } else if (alert) {
    const pa = 0.75 + 0.25 * Math.sin(t * 10);
    ctx.fillStyle = `rgba(208,59,59,${pa})`; ctx.beginPath(); ctx.roundRect(P.x + rw + 50, P.y + 150, 176, 44, 22); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText('ALERT', P.x + rw + 104, P.y + 180);
    ctx.font = `500 16px ${SANS}`; ctx.fillStyle = '#52514e'; ctx.fillText('above 3.0% threshold', P.x + rw + 52, P.y + 218);
  } else {
    ctx.fillStyle = '#52514e'; ctx.font = `500 18px ${SANS}`; ctx.fillText('No alert · below 3.0% threshold', P.x + rw + 52, P.y + 184);
  }
  // two checks
  const cy = P.y + 236;
  ctx.fillStyle = '#e6e5e1'; ctx.fillRect(P.x + 24, cy - 16, P.w - 48, 2);
  ctx.font = `600 15px ${SANS}`; ctx.fillStyle = '#52514e';
  ctx.fillText('INPUT TRUST', P.x + 28, cy + 16); ctx.fillText('MODEL CONFIDENCE', P.x + 318, cy + 16);
  ctx.font = `700 34px ${SANS}`;
  if (trustLow) { ctx.fillStyle = '#d03b3b'; ctx.fillText('⛔ LOW', P.x + 26, cy + 62); }
  else { ctx.fillStyle = '#0ca30c'; ctx.fillText('✓ HIGH', P.x + 26, cy + 62); }
  ctx.fillStyle = '#0b0b0b'; ctx.fillText('Confident', P.x + 316, cy + 62);
  ctx.font = `500 15px ${SANS}`; ctx.fillStyle = '#52514e';
  ctx.fillText(trustLow ? 'inputs not believable' : 'inputs look reliable', P.x + 28, cy + 88);
  ctx.fillText('5 models agree', P.x + 318, cy + 88);
  // LOW TRUST banner
  if (trustLow) {
    const bh = 104 * tl;
    ctx.save(); ctx.beginPath(); ctx.rect(P.x, P.y + P.h - 118, P.w, 118); ctx.clip();
    ctx.fillStyle = '#d03b3b'; ctx.beginPath(); ctx.roundRect(P.x + 18, P.y + P.h - 14 - bh, P.w - 36, bh, 12); ctx.fill();
    ctx.globalAlpha = appear * tl;
    ctx.fillStyle = '#fff'; ctx.font = `800 30px ${SANS}`; ctx.fillText('LOW TRUST — Verify Input Data', P.x + 40, P.y + P.h - 70);
    ctx.font = `500 17px ${SANS}`; ctx.fillText('98.4 °C is physiologically impossible — check units / sensor', P.x + 40, P.y + P.h - 38);
    ctx.restore();
  }
  ctx.restore();
}

// ---------- captions (lower third, understated) ----------
window.SHOW_CAPTIONS = true;
function drawCaption(ctx, t) {
  const caps = [[0.4, T_GLITCH, 'ICU patient · vital signs streaming to an early-warning model'],
                [T_GLITCH, T_RISK, 'The thermometer starts reporting °F into a °C field'],
                [T_RISK, T_TRUST, 'The risk score rises — driven by a reading that cannot be real'],
                [T_TRUST, DUR, 'SepsisShield checks the inputs before trusting the prediction']];
  for (const [a, b, txt] of (window.SHOW_CAPTIONS ? caps : [])) {
    const u = Math.min(ease((t - a) / 0.25), ease((b - t) / 0.25));
    if (u <= 0) continue;
    ctx.save(); ctx.globalAlpha = u;
    ctx.font = `500 30px ${SANS}`;
    const w = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(8,12,16,0.72)'; ctx.beginPath(); ctx.roundRect((W - w) / 2 - 28, 952, w + 56, 58, 12); ctx.fill();
    ctx.fillStyle = '#eef2f5'; ctx.fillText(txt, (W - w) / 2, 991);
    ctx.restore();
  }
  ctx.font = `500 15px ${SANS}`; ctx.fillStyle = 'rgba(200,210,220,0.55)';
  ctx.fillText('Illustration · values from held-out test patient p119917 (PhysioNet 2019) · research prototype', 60, 1062);
}

window.render = function (t) {
  const zoom = 1 + 0.045 * ease(t / DUR);       // slow cinematic push-in
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, -(zoom - 1) * W * 0.55, -(zoom - 1) * H * 0.45);
  g.drawImage(bg, 0, 0);
  drawMonitor(g, t);
  drawPanel(g, t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawCaption(g, t);
  // fade in from black, fade out to the light title card of the main video
  const fin = 1 - ease(t / 0.5);
  if (fin > 0) { g.fillStyle = `rgba(0,0,0,${fin})`; g.fillRect(0, 0, W, H); }
  const fout = ease((t - T_FADE) / (DUR - T_FADE));
  if (fout > 0) { g.fillStyle = `rgba(252,252,251,${fout})`; g.fillRect(0, 0, W, H); }
};
window.render(0);
window.READY = true;
</script>
</body></html>
