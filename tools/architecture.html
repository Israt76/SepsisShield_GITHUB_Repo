<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; background:#fcfcfb; font-family: "Noto Sans CJK JP", "DejaVu Sans", sans-serif; }
  svg text { font-family: inherit; }
</style></head>
<body>
<svg id="arch" width="1700" height="760" viewBox="0 0 1700 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="1700" height="760" fill="#fcfcfb"/>
  <text x="50" y="62" font-size="34" font-weight="700" fill="#0b0b0b">SepsisShield AI — trust-aware early warning</text>
  <text x="50" y="100" font-size="21" fill="#52514e">Two independent paths from the same raw data: one predicts risk, one decides whether the inputs deserve to be believed.</text>

  <!-- lane backgrounds -->
  <rect x="300" y="140" width="1010" height="245" rx="18" fill="#eef4fc"/>
  <text x="325" y="175" font-size="18" font-weight="700" fill="#1c5cab" letter-spacing="1.5">PREDICTION PATH</text>
  <rect x="300" y="410" width="1010" height="245" rx="18" fill="#fdf1ec"/>
  <text x="325" y="445" font-size="18" font-weight="700" fill="#b3461d" letter-spacing="1.5">TRUST PATH · the novel component</text>

  <!-- input -->
  <rect x="50" y="330" width="210" height="140" rx="14" fill="#ffffff" stroke="#8a8984" stroke-width="2"/>
  <text x="155" y="378" font-size="21" font-weight="700" text-anchor="middle" fill="#0b0b0b">Raw ICU data</text>
  <text x="155" y="408" font-size="17" text-anchor="middle" fill="#52514e">hourly vitals, labs,</text>
  <text x="155" y="432" font-size="17" text-anchor="middle" fill="#52514e">demographics</text>

  <!-- prediction boxes -->
  <g font-size="17" text-anchor="middle">
    <rect x="330" y="200" width="220" height="150" rx="14" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
    <text x="440" y="250" font-weight="700" font-size="20" fill="#0b0b0b">Causal features</text>
    <text x="440" y="280" fill="#52514e">172 per hour</text>
    <text x="440" y="304" fill="#52514e">no look-ahead</text>
    <text x="440" y="328" fill="#52514e">(unit-tested)</text>

    <rect x="590" y="200" width="220" height="150" rx="14" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
    <text x="700" y="250" font-weight="700" font-size="20" fill="#0b0b0b">5 × LightGBM</text>
    <text x="700" y="280" fill="#52514e">ensemble</text>
    <text x="700" y="304" fill="#52514e">+ SHAP explanations</text>

    <rect x="850" y="200" width="200" height="150" rx="14" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
    <text x="950" y="250" font-weight="700" font-size="20" fill="#0b0b0b">Isotonic</text>
    <text x="950" y="276" font-weight="700" font-size="20" fill="#0b0b0b">calibration</text>
    <text x="950" y="306" fill="#52514e">fit on validation</text>

    <rect x="1090" y="200" width="200" height="70" rx="14" fill="#2a78d6"/>
    <text x="1190" y="243" font-weight="700" font-size="19" fill="#fff">Risk % + alert</text>
    <rect x="1090" y="285" width="200" height="75" rx="14" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
    <text x="1190" y="316" font-weight="700" font-size="17" fill="#0b0b0b">Model confidence</text>
    <text x="1190" y="340" fill="#52514e" font-size="15">5-model spread (log-odds)</text>
  </g>

  <!-- trust boxes -->
  <g font-size="17" text-anchor="middle">
    <rect x="330" y="470" width="720" height="160" rx="14" fill="#fff" stroke="#eb6834" stroke-width="2"/>
    <text x="690" y="510" font-weight="700" font-size="20" fill="#0b0b0b">Input-integrity layer — runs on raw inputs, independent of the model</text>
    <text x="690" y="545" fill="#52514e">physiological plausibility · blood-pressure consistency · abrupt jumps</text>
    <text x="690" y="572" fill="#52514e">coordinated "normalising" shifts (manipulation signature) · frozen feeds</text>
    <text x="690" y="604" fill="#8a4a2c" font-size="16">all thresholds fitted on clean training data — no corruption or attack data used to fit them</text>

    <rect x="1090" y="505" width="200" height="90" rx="14" fill="#eb6834"/>
    <text x="1190" y="545" font-weight="700" font-size="19" fill="#fff">Input trust</text>
    <text x="1190" y="572" fill="#fff" font-size="16">HIGH · REDUCED · LOW</text>
  </g>

  <!-- decision -->
  <rect x="1360" y="270" width="290" height="300" rx="16" fill="#0b0b0b"/>
  <text x="1505" y="318" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">Trust-aware decision</text>
  <g font-size="18" fill="#fff">
    <circle cx="1392" cy="370" r="9" fill="#0ca30c"/><text x="1412" y="376">HIGH → show prediction</text>
    <circle cx="1392" cy="420" r="9" fill="#fab219"/><text x="1412" y="426">REDUCED → show + verify</text>
    <circle cx="1392" cy="470" r="9" fill="#d03b3b"/><text x="1412" y="476">LOW → withhold,</text>
    <text x="1412" y="500">request verification</text>
  </g>
  <text x="1505" y="545" font-size="15" text-anchor="middle" fill="#c3c2b7">→ dashboard with explanation</text>

  <!-- arrows -->
  <g stroke="#52514e" stroke-width="2.4" fill="none" marker-end="url(#ar)">
    <path d="M260,380 C290,380 290,275 326,275"/>
    <path d="M260,420 C290,420 290,550 326,550"/>
    <path d="M550,275 L586,275"/>
    <path d="M810,275 L846,275"/>
    <path d="M1050,240 L1086,240"/>
    <path d="M700,350 L700,376 L1190,376 L1190,366" stroke-dasharray="6 5"/>
    <path d="M1050,550 L1086,550"/>
    <path d="M1290,235 C1330,235 1320,330 1356,330"/>
    <path d="M1290,322 C1320,322 1330,380 1356,380"/>
    <path d="M1290,550 C1330,550 1320,470 1356,470"/>
  </g>
  <text x="50" y="720" font-size="17" fill="#52514e">Model confidence asks "do the models agree?"  Input trust asks "are the inputs believable?"  A model can be confident about corrupted inputs — so SepsisShield checks both.</text>
</svg>
</body></html>
